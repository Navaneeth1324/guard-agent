openapi: 3.1.0
info:
  title: GuardAgent Pre-Execution Safety Gateway
  description: Pre-execution guardrail gateway intercepting and evaluating LLM tool call parameters for students.
  version: 1.0.0
servers:
  - url: https://guardagent-api-demo.hf.space
    description: Free HuggingFace Spaces / FastAPI Backend
paths:
  /v1/inspect_tool:
    post:
      operationId: checkToolSafety
      summary: Evaluate tool name and arguments for security threats prior to execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tool_name
                - arguments
              properties:
                tool_name:
                  type: string
                  description: Name of the tool function (e.g., execute_sql, bash_command, file_reader)
                  example: "execute_sql"
                arguments:
                  type: object
                  description: The exact parameters generated by the LLM
                  example: {"query": "DROP TABLE users;"}
      responses:
        '200':
          description: Risk assessment verdict returned by 4-bit QLoRA SLM
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_score:
                    type: number
                    description: Calculated risk from 0.0 (safe) to 100.0 (critical threat)
                    example: 89.4
                  threat_category:
                    type: string
                    example: "system_abuse"
                  verdict:
                    type: string
                    enum: [ALLOW, REVIEW, BLOCK]
                    example: "BLOCK"
                  reasoning:
                    type: string
                    example: "Destructive SQL operation detected. DROPs entire users table without backup."
